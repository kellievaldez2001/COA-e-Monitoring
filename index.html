<!DOCTYPE html>
<html>
<head>
<title>COA Ultra Monitoring System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
COA Ultra Monitoring & Compliance System
<span class="notification">🔔 <span id="notifCount" class="badge">0</span></span>
</div>

<div class="login" id="loginPage">
    <div class="login-box">
        <h3>Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div class="dashboard" id="dashboard">

<div class="card">
Welcome: <b id="userLabel"></b>
<button onclick="logout()" style="float:right;">Logout</button>
</div>

<div id="adminPanel" style="display:none;" class="card">
<h3>Admin Controls</h3>
<button onclick="addReport()">Add Report</button>
<button onclick="sendReminder()">Send Reminder</button>
</div>

<div class="card">
<h3>Reports</h3>
<table id="table"></table>
</div>

<div class="card">
<h3>Inbox</h3>
<div id="inbox"></div>
</div>

<div class="card">
<h3>Audit Trail</h3>
<div id="auditLog"></div>
</div>

</div>
<script src="test.js"></script>

</body>
</html>
